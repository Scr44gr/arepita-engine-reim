[package]
name = "imgui"
version = "1.92.8"
edition = "2026"

[dependencies]
sdl3 = { path = "../sdl3", version = "^3.4" }
wgpu = { path = "../wgpu", version = "^29.0" }

[native.windows-x86_64]
library-paths = ["native/windows-x86_64"]
link-libraries = ["imgui"]
runtime-files = ["native/windows-x86_64/imgui.dll"]

[profile.debug]
optimization = 0

[profile.release]
optimization = 3
